name: CD - Build, Push & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push images to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, farm-service, monitoring-service, gateway-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartfarm-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartfarm-${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Create production .env for EC2
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_HOST=mysql
          MYSQL_PORT=3306
          MYSQL_USER=root
          MYSQL_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USERS_DB=${{ secrets.MYSQL_USERS_DB }}
          MYSQL_FARMS_DB=${{ secrets.MYSQL_FARMS_DB }}
          MONGODB_HOST=mongodb
          MONGODB_PORT=27017
          MONGODB_USER=
          MONGODB_PASSWORD=
          MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}
          USER_SERVICE_URL=http://user-service:8001
          FARM_SERVICE_URL=http://farm-service:8002
          MONITORING_SERVICE_URL=http://monitoring-service:8003
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Copy compose file, .env and init scripts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yaml,.env,init-db"
          target: "/home/${{ secrets.EC2_USER }}/smartfarm"

      - name: Pull images and start services on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/smartfarm
            if docker info >/dev/null 2>&1; then DOCKER=docker; else DOCKER="sudo docker"; fi
            $DOCKER compose -f docker-compose.prod.yaml pull
            $DOCKER compose -f docker-compose.prod.yaml up -d --remove-orphans
            sleep 20
            curl -fsS http://localhost:3000/health || true