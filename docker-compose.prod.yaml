# ==============================================================================
# PRODUCTION COMPOSE FILE — used on the EC2 server via CI/CD.
# Unlike docker-compose.yaml (local dev), this file does NOT build images.
# It pulls pre-built images from Docker Hub, which are pushed by
# .github/workflows/cd.yml on every push to main.
#
# Usage on EC2:
#   docker compose -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.prod.yaml up -d
#
# Requires a .env file with: MYSQL_ROOT_PASSWORD, MYSQL_USERS_DB,
# MYSQL_FARMS_DB, MONGODB_DATABASE, DOCKERHUB_USERNAME
# ==============================================================================

services:
  # ==============================================================================
  # Database Layer (Shared MySQL & MongoDB)
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: smartfarm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # NOTE: DB ports are NOT published publicly on EC2 for security.
    # Services reach MySQL over the internal smartfarm_net network.
    volumes:
      - mysql_data:/var/lib/mysql
      # Map SQL script to automatically create isolated schemas on startup
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:6.0
    container_name: smartfarm_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================================
  # Backend FastAPI Services Layer (images from Docker Hub)
  # ==============================================================================
  user-service:
    image: ${DOCKERHUB_USERNAME}/smartfarm-user-service:latest
    container_name: smartfarm_user_service
    restart: always
    # Commented out on EC2: services talk over the internal network only.
    # Uncomment to access http://<ec2-ip>:8001/docs publicly.
    # ports:
    #   - "8001:8001"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USERS_DB=${MYSQL_USERS_DB}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 3s
      retries: 3

  farm-service:
    image: ${DOCKERHUB_USERNAME}/smartfarm-farm-service:latest
    container_name: smartfarm_farm_service
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_FARMS_DB=${MYSQL_FARMS_DB}
      - USER_SERVICE_URL=http://user-service:8001
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 60s
      timeout: 3s
      retries: 3

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/smartfarm-monitoring-service:latest
    container_name: smartfarm_monitoring_service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - FARM_SERVICE_URL=http://farm-service:8002
    depends_on:
      mongodb:
        condition: service_healthy
      farm-service:
        condition: service_healthy
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 60s
      timeout: 3s
      retries: 3

  # ==============================================================================
  # Browser-facing gateway (the ONLY public port: 3000)
  # ==============================================================================
  gateway-service:
    image: ${DOCKERHUB_USERNAME}/smartfarm-gateway-service:latest
    container_name: smartfarm_gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - FARM_SERVICE_URL=http://farm-service:8002
      - MONITORING_SERVICE_URL=http://monitoring-service:8003
    depends_on:
      user-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
    networks:
      - smartfarm_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 3s
      retries: 3

# ==============================================================================
# Persistent Volumes & Private Network Declarations
# ==============================================================================
volumes:
  mysql_data:
  mongodb_data:

networks:
  smartfarm_net:
    driver: bridge
